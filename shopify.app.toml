# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7eb5d1def41d9d84096bd528642361e9"
name = "thank-snap"
application_url = "https://app.thanksnap.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# This app doesn't call the Admin API for anything scope-gated (billing
# charges and the checkout extension's own endpoints don't require access
# scopes), so this is intentionally empty - the field must still be present.
scopes = ""

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory compliance webhooks - required for every public app on the
  # Shopify App Store, regardless of whether it uses protected customer data.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [ "https://app.thanksnap.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
