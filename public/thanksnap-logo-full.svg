<!-- thankSnap logo, full detail (3-row survey/form mark). Cleaned from the
     original design-tool export, which had a stray full-canvas #1E1E1E
     background rect (a leftover artboard fill, not part of the mark) -
     removed here so it renders on a transparent background. Reads well at
     app-icon/listing size; at nav/favicon size (~16-32px) the two fainter
     lower rows blur together - use a single bold bar+dot variant there
     instead if one's needed. -->
